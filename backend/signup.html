<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">

    <title>Signup</title>

    <style>
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }

        input.invalid {
            border: 1px solid red;
        }

        .success {
            color: green;
        }
    </style>
</head>
<body>

    <h1>Login</h1>

    <form id="login" action="process-login.php" method="post" novalidate>

        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
            <span class="error" id="name-error"></span>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <span class="error" id="email-error"></span>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
            <span class="error" id="password-error"></span>
        </div>

        <div>
            <label for="password_confirmation">Confirm Password</label>
            <input type="password"
                   id="password_confirmation"
                   name="password_confirmation">
            <span class="error" id="confirmation-error"></span>
        </div>

        <button type="submit">Sign Up</button>

        <p id="form-message"></p>

    </form>

    <script>
        const form = document.getElementById("signup");

        form.addEventListener("submit", function(event) {
            let hasError = false;

            // Get field values
            const name = document.getElementById("name");
            const email = document.getElementById("email");
            const password = document.getElementById("password");
            const confirmation = document.getElementById("password_confirmation");

            // Clear previous errors
            document.querySelectorAll(".error").forEach(function(error) {
                error.textContent = "";
            });

            document.querySelectorAll("input").forEach(function(input) {
                input.classList.remove("invalid");
            });

            document.getElementById("form-message").textContent = "";

            // Name validation
            if (name.value.trim() === "") {
                showError(name, "name-error", "Name is required.");
                hasError = true;
            }

            // Email validation
            if (email.value.trim() === "") {
                showError(email, "email-error", "Email is required.");
                hasError = true;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
                showError(email, "email-error", "Please enter a valid email address.");
                hasError = true;
            }

            // Password validation
            if (password.value === "") {
                showError(password, "password-error", "Password is required.");
                hasError = true;
            } else if (password.value.length < 8) {
                showError(password, "password-error", "Password must be at least 8 characters.");
                hasError = true;
            } else if (!/[a-zA-Z]/.test(password.value) ||
                       !/[0-9]/.test(password.value)) {
                showError(password, "password-error",
                    "Password must contain at least one letter and one number.");
                hasError = true;
            }

            // Confirm password validation
            if (confirmation.value === "") {
                showError(confirmation, "confirmation-error",
                    "Please confirm your password.");
                hasError = true;
            } else if (password.value !== confirmation.value) {
                showError(confirmation, "confirmation-error",
                    "Passwords do not match.");
                hasError = true;
            }

            // Stop form submission if there are errors
            if (hasError) {
                event.preventDefault();
                document.getElementById("form-message").textContent =
                    "Please correct the errors above.";
                document.getElementById("form-message").style.color = "red";
            }
        });

        function showError(input, errorId, message) {
            document.getElementById(errorId).textContent = message;
            input.classList.add("invalid");
        }
    </script>

</body>
</html>
